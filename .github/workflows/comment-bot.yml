name: comment-bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sinov: javoblarni faqat ko'rsatadi, Instagram'ga yozmaydi"
        type: boolean
        default: true

concurrency:
  group: comment-bot
  cancel-in-progress: false

jobs:
  reply:
    # Scheduled runs work only after the repo variable BOT_ENABLED is set to 1
    if: github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reply to comments
        run: python -u bot/comment_bot.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          MODEL: ${{ vars.MODEL }}
          WINDOW_HOURS: ${{ vars.WINDOW_HOURS }}
          MAX_REPLIES: ${{ vars.MAX_REPLIES }}
